[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openf1-data-platform"
version = "0.1.0"
description = "Projeto de estudo para extração e processamento de dados da OpenF1"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow==25.0.1",
    "python-dotenv>=1,<2",
    "requests==2.34.2"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools]
package-dir = {"" = "src"}
