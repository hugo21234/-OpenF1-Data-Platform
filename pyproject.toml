[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openf1-data-platform"
version = "0.1.0"
description = "Projeto de estudo para extração e processamento de dados da OpenF1"
requires-python = ">=3.11"
dependencies = [
    "requests"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["extrator*", "Request*"]